name: Go CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulncheck:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.3
          args: --timeout=5m

  test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: [vulncheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Run tests with coverage
        run: |
          go test -v -covermode atomic -coverprofile=coverage.out $(go list ./... | grep -vE '/(mock|infrastructure|cmd|docs)')
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Build
        run: go build -o api cmd/api/main.go
      - name: Upload build artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: api-binary
          path: api

  docker:
    name: Build & Push Image
    runs-on: ubuntu-latest
    environment: Production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          docker build -t madsilver/task-manager-api:${COMMIT} -t madsilver/task-manager-api:latest .
          docker push madsilver/task-manager-api:${COMMIT}
          docker push madsilver/task-manager-api:latest
